<style>
  html,body{ margin:0; padding:0; overflow:hidden; height:100%; background:#111; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  #crosshair{
    position:fixed; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; background:rgba(255,255,255,0.85); box-shadow:0 0 0 1px rgba(0,0,0,0.35);
    pointer-events:none; z-index:5; display:none;
  }
  #joystick{
    position:fixed; left:26px; bottom:26px; width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,0.35); border:1px solid rgba(17,17,17,0.25);
    display:none; z-index:6; touch-action:none;
  }
  #joystickNub{
    position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
    border-radius:50%; background:rgba(17,17,17,0.55); pointer-events:none;
  }
  #leaveBtn{
    position:fixed; top:16px; right:16px; z-index:6; display:none;
    background:rgba(255,255,255,0.75); color:#111; border:none; border-radius:20px;
    font-size:12px; letter-spacing:1px; text-transform:uppercase; font-weight:600;
    padding:9px 16px; font-family:inherit; cursor:pointer;
  }
  #interactHint{
    position:fixed; top:calc(50% + 20px); left:50%; transform:translateX(-50%);
    color:#111; font-size:11px; letter-spacing:1px; background:rgba(255,255,255,0.75);
    padding:5px 10px; border-radius:4px; pointer-events:none; z-index:5; opacity:0; transition:opacity 0.15s ease;
  }
  #interactHint.show{ opacity:1; }
  #jeffBubble{
    position:fixed; transform:translate(-50%,-100%); max-width:260px;
    background:#fff; color:#161616; font-size:13px; line-height:1.4;
    padding:10px 14px; border-radius:12px; border:1px solid #d8d8d5;
    box-shadow:0 8px 22px rgba(0,0,0,0.18); pointer-events:none; z-index:6;
    opacity:0; transition:opacity 0.2s ease; text-align:left;
  }
  #jeffBubble.show{ opacity:1; }
  #jeffBubble::after{
    content:''; position:absolute; left:50%; top:100%; margin-left:-7px;
    border:7px solid transparent; border-top-color:#fff;
  }
  #jeffBubble .src{ display:block; margin-top:4px; font-size:10.5px; color:#8a8a86; letter-spacing:0.3px; }
  #hud{
    position:fixed; top:16px; left:20px; color:#111; font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; opacity:0.55; pointer-events:none; z-index:5; display:none;
    background:rgba(255,255,255,0.7); padding:6px 10px; border-radius:4px;
  }
  #overlay{
    position:fixed; inset:0; background-color:#ffffff; color:#111;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; z-index:10; cursor:pointer; transition:opacity 0.5s ease;
    overflow:hidden;
  }
  #overlay .overlayContent{ position:relative; z-index:1; }
  .srOnly{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  #particleTitle{
    width:100vw; height:clamp(420px, 78vh, 820px); margin:0;
    pointer-events:none; /* clicks pass through to the overlay beneath */
  }
  #particleTitle canvas{ display:block; }
  #overlay h1{ font-size:15px; letter-spacing:5px; text-transform:uppercase; font-weight:600; margin:0; }
  #overlay .loader{ display:flex; flex-direction:column; align-items:center; gap:8px; transition:opacity 0.5s ease; margin-right:6px; }
  #overlay .pct{ font-size:24px; font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums; color:#111; margin:0; }
  #overlay .loaderBar{ width:130px; height:4px; background:rgba(17,17,17,0.12); border-radius:2px; overflow:hidden; }
  #overlay .loaderFill{
    height:100%; width:0%; border-radius:2px; transition:width 0.25s ease;
    background:linear-gradient(90deg,#ff7a00,#ff0169,#d300c5);
    background-size:200% 100%; animation:loaderShimmer 1.4s linear infinite;
  }
  @keyframes loaderShimmer{ 0%{ background-position:0% 0; } 100%{ background-position:200% 0; } }

  .social-login-icons {
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; z-index:2;
    -webkit-box-reflect: below 5px linear-gradient(transparent, #00000022);
  }
  .social-login-icons svg{ width:40px; }
  .social-icon-1, .social-icon-1-1, .social-icon-2, .social-icon-2-2,
  .social-icon-3, .social-icon-3-3, .social-icon-4, .social-icon-4-4,
  .social-icon-5, .social-icon-5-5{
    width:50px; height:50px; display:flex; align-items:center; justify-content:center;
    border-radius:50px; margin:20px 0 0 0;
  }
  .icon svg{ fill:#111; }
  .socialcontainer{ height:80px; overflow:hidden; cursor:pointer; }
  .social-icon-1{ transition-duration:0.4s; background-color:rgb(0,0,0); transition-timing-function:cubic-bezier(0.46,-0.78,0.5,1.56); }
  .social-icon-1 svg, .social-icon-2 svg, .social-icon-3 svg, .social-icon-4 svg, .social-icon-5 svg{ opacity:0; transition-duration:0.5s; transition-delay:0.2s; }

  .socialcontainer:hover .social-icon-1{ transform:translateY(-70px); }
  .socialcontainer:hover .social-icon-1 svg, .socialcontainer:hover .social-icon-2 svg,
  .socialcontainer:hover .social-icon-3 svg, .socialcontainer:hover .social-icon-4 svg,

    transition-duration:0.4s; transition-timing-function:cubic-bezier(0.46,-0.78,0.5,1.56);
    background:linear-gradient(72.44deg,#ff7a00 11.92%,#ff0169 51.56%,#d300c5 85.69%);
  }
  .socialcontainer:hover .social-icon-2{ transform:translateY(-70px); }
  .social-icon-3{ transition-duration:0.4s; transition-timing-function:cubic-bezier(0.46,-0.78,0.5,1.56); background:#316ff6; }
  .socialcontainer:hover .social-icon-3{ transform:translateY(-70px); }
  .social-icon-4{

  .socialcontainer:hover .social-icon-4{ transform:translateY(-70px); }

  .socialcontainer:hover .social-icon-5{ transform:translateY(-70px); }

(function(){
  const mount = document.getElementById('particleTitle');
  const fallbackH1 = document.querySelector('#overlay h1.srOnly');
  if(!mount || typeof PIXI === 'undefined'){
    // hard failure (PixiJS itself didn't load) — fall back to plain visible text
    // rather than leaving the entry screen with no title at all
    if(fallbackH1){ fallbackH1.classList.remove('srOnly'); fallbackH1.style.fontSize='clamp(28px,6vw,64px)'; fallbackH1.style.letterSpacing='0.15em'; }
    return;
  }

  const FONT_FAMILY = "Luckiest Guy";
  const FONT_WEIGHT = 700;
  const FRICTION = 0.86;
  const MOVE_SPEED = 0.1;
  const TITLE_TEXT = "ART NOMAD\nGALLERY";
  const TITLE_COLOR = "111111"; // black, for the white background

  function hexToRGB(hex){
    const d = parseInt(hex,16);
    return [((d>>16)&0xff)/255, ((d>>8)&0xff)/255, (d&0xff)/255];
  }

  function Point(x,y){ this.x=x; this.y=y; }

  function Particle(point, texture){
    this.sprite = new PIXI.Sprite(texture);
    this.sprite.scale.set(0.3);
    this.prevPoint = new Point(point.x, point.y);
    this.currPoint = new Point(point.x, point.y);
    this.sprite.x = this.currPoint.x; this.sprite.y = this.currPoint.y;
    this.vector = new Point(0,0);
    this.radius = 5;
  }
  Particle.prototype.draw = function(){
    this.vector.x += (this.prevPoint.x-this.currPoint.x)*MOVE_SPEED;
    this.vector.y += (this.prevPoint.y-this.currPoint.y)*MOVE_SPEED;
    this.vector.x *= FRICTION; this.vector.y *= FRICTION;
    this.currPoint.x += this.vector.x; this.currPoint.y += this.vector.y;
    this.sprite.x = this.currPoint.x; this.sprite.y = this.currPoint.y;
  };

  function TextSampler(){
    this.canvas = document.querySelector('#canvas');
    this.ctx = this.canvas ? this.canvas.getContext('2d', { willReadFrequently:true }) : null;
  }
  TextSampler.prototype.setText = function(str, density, fontSize, canvasWidth, canvasHeight, fontFamily){
    if(!this.canvas || !this.ctx) return [];
    this.canvas.width = canvasWidth; this.canvas.height = canvasHeight;
    const lines = str.split("\n");
    const lineHeight = fontSize + 10;
    this.ctx.clearRect(0,0,canvasWidth,canvasHeight);
    this.ctx.font = `${FONT_WEIGHT} ${fontSize}px ${fontFamily || FONT_FAMILY}`;
    this.ctx.lineWidth = 2;
    this.ctx.strokeStyle = 'rgba(0,0,0,1)';
    for(let i=0;i<lines.length;i++){
      const text = lines[i];
      const m = this.ctx.measureText(text);
      this.ctx.strokeText(text, (canvasWidth-m.width)/2, lineHeight*(i+1)+(canvasHeight-lineHeight*lines.length)/2);
    }
    return this.dotPositions(density, canvasWidth, canvasHeight);
  };
  TextSampler.prototype.dotPositions = function(density, canvasWidth, canvasHeight){
    if(!this.ctx) return [];
    const data = this.ctx.getImageData(0,0,canvasWidth,canvasHeight).data;
    const particles = [];
    let i=0, w=0, pixel=0;
    for(let h=0; h<canvasHeight; h+=density){
      i++; w=0;
      if(i%2===1) w += 6;
      for(w; w<canvasWidth; w+=density){
        pixel = data[(w+h*canvasWidth)*4 - 1];
        if(pixel!==0 && w>0 && w<canvasWidth && h>0 && h<canvasHeight){
          particles.push(new Point(w,h));
        }
      }
    }
    return particles;
  };

  function makeDotTexture(){
    // a soft radial-gradient dot drawn to a canvas, so the title has no external asset dependency
    const c = document.createElement('canvas');
    c.width = 16; c.height = 16;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(8,8,0,8,8,8);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.7, 'rgba(255,255,255,0.7)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(8,8,8,0,Math.PI*2); ctx.fill();
    return PIXI.Texture.from(c);
  }

  function Visual(containerEl, fontFamily){
    this.containerEl = containerEl;
    this.fontFamily = fontFamily || FONT_FAMILY;
    this.text = new TextSampler();
    this.texture = makeDotTexture();
    this.mouse = { x:-9999, y:-9999, radius:95 };
    this.particles = [];
    this.particleContainer = null;
    this.positions = [];
    document.addEventListener('pointermove', this.onMove.bind(this), false);
  }
  Visual.prototype.render = function(text, container, density, fontSize, w, h){
    if(this.particleContainer) container.removeChild(this.particleContainer);
    this.positions = this.text.setText(text, density, fontSize, w, h, this.fontFamily);
    this.particleContainer = new PIXI.ParticleContainer(this.positions.length, {
      vertices:false, position:true, rotation:false, scale:false, uvs:false, tint:true
    });
    container.addChild(this.particleContainer);
    this.particles = [];
    for(let i=0;i<this.positions.length;i++){
      const p = new Particle(this.positions[i], this.texture);
      this.particleContainer.addChild(p.sprite);
      this.particles.push(p);
    }
  };
  Visual.prototype.animate = function(){
    for(let i=0;i<this.particles.length;i++){
      const particle = this.particles[i];
      const dx = this.mouse.x - particle.currPoint.x;
      const dy = this.mouse.y - particle.currPoint.y;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const minDist = particle.radius + this.mouse.radius;
      if(dist < minDist){
        const angle = Math.atan2(dy,dx);
        const tx = particle.currPoint.x + Math.cos(angle)*minDist;
        const ty = particle.currPoint.y + Math.sin(angle)*minDist;
        particle.vector.x -= (tx-this.mouse.x);
        particle.vector.y -= (ty-this.mouse.y);
      }
      particle.draw();
    }
  };
  Visual.prototype.onMove = function(e){
    const rect = this.containerEl.getBoundingClientRect();
    this.mouse.x = e.clientX - rect.left;
    this.mouse.y = e.clientY - rect.top;
  };

  function TitleApp(){
    this.visual = null;
    this.w = mount.clientWidth || 620;
    this.h = mount.clientHeight || 150;
    this.renderer = new PIXI.Renderer({
      width:this.w, height:this.h, antialias:true,
      resolution: window.devicePixelRatio>1?2:1, autoDensity:true,
      powerPreference:'high-performance', backgroundAlpha:0
    });
    mount.appendChild(this.renderer.view);
    this.container = new PIXI.Container();
    this.applyFilters();
    const beginWith = (fontFamily)=>{
      this.visual = new Visual(mount, fontFamily);
      window.addEventListener('resize', this.resize.bind(this), false);
      this.resize();
      requestAnimationFrame(this.animate.bind(this));
    };
    if(typeof WebFont === 'undefined'){
      // WebFont Loader CDN itself didn't come through — don't wait forever, just
      // render with a fallback display font instead of showing nothing
      beginWith('Impact, "Arial Black", sans-serif');
      return;
    }
    let started = false;
    const startOnce = (fontFamily)=>{ if(started) return; started = true; beginWith(fontFamily); };
    WebFont.load({
      google:{ families:[FONT_FAMILY] },
      timeout: 3000,
      fontactive: ()=> startOnce(FONT_FAMILY),
      fontinactive: ()=> startOnce('Impact, "Arial Black", sans-serif'),
      active: ()=> startOnce(FONT_FAMILY),
      inactive: ()=> startOnce('Impact, "Arial Black", sans-serif')
    });
    // belt-and-braces: if none of WebFont's callbacks ever fire for any reason,
    // don't leave the title blank indefinitely
    setTimeout(()=> startOnce('Impact, "Arial Black", sans-serif'), 4000);
  }
  TitleApp.prototype.applyFilters = function(){
    const blur = new PIXI.filters.BlurFilter();
    blur.blur = 10; blur.autoFit = true; blur.padding = 40;
    const frag = `
      precision mediump float;
      varying vec2 vTextureCoord;
      uniform sampler2D uSampler;
      uniform float threshold;
      uniform vec3 color;
      void main(void){
        vec4 orig = texture2D(uSampler, vTextureCoord);
        if(orig.a > threshold){ gl_FragColor = vec4(color,1.0); }
        else { gl_FragColor = vec4(vec3(0.0),0.0); }
      }`;
    const thresholdFilter = new PIXI.Filter('', frag, { threshold:0.5, color:hexToRGB(TITLE_COLOR) });
    this.container.filters = [blur, thresholdFilter];
    this.container.filterArea = this.renderer.screen;
  };
  TitleApp.prototype.resize = function(){
    // the overlay (and this mount) reads 0x0 while hidden behind the gallery — skip rather than
    // falling back to a tiny hardcoded size, which would otherwise get stuck permanently and
    // render the title small once the overlay comes back after leaving the gallery
    if(!mount.clientWidth || !mount.clientHeight) return;
    this.w = mount.clientWidth;
    this.h = mount.clientHeight;
    const fontSize = Math.min(this.w*0.17, this.h*0.26);
    if(this.renderer) this.renderer.resize(this.w, this.h);
    if(this.visual){
      this.visual.render(TITLE_TEXT, this.container, window.devicePixelRatio>1?2:1, fontSize, this.w, this.h);
    }
  };
  TitleApp.prototype.animate = function(){
    requestAnimationFrame(this.animate.bind(this));
    if(this.renderer) this.renderer.render(this.container);
    if(this.visual) this.visual.animate();
  };

  new TitleApp();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
  const container = document.getElementById('app');
  const overlay = document.getElementById('overlay');
  const pctEl = document.getElementById('pct');
  const loaderEl = document.getElementById('loader');
  const loaderFillEl = document.getElementById('loaderFill');
  let assetsReady = false;
  const crosshair = document.getElementById('crosshair');
  const hud = document.getElementById('hud');
  const interactHint = document.getElementById('interactHint');

  // ---------- artwork pool: live images pulled from Artguru666's GitHub art folders ----------
  const ARTWORK_REPO = 'Artguru666/Artguru666.github.io';
  const ARTWORK_BRANCH = 'master';
  const ARTWORK_FOLDERS = ['Abstract','Drawings','Me','Nanokitsch','Paintings','Sculpture','Stickers','[Originals]'];
  const IMAGE_EXT_RE = /\.(jpe?g|png|gif|webp|avif)$/i;
  const ARTWORK_CACHE_KEY = 'artworkPoolCache_v1';
  const ARTWORK_CACHE_TTL_MS = 15*60*1000;
  async function fetchArtworkPool(){
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem(ARTWORK_CACHE_KEY) || 'null'); }catch(e){}
    if(cached && Array.isArray(cached.pool) && cached.pool.length && (Date.now()-cached.at) < ARTWORK_CACHE_TTL_MS){
      return cached.pool;
    }
    try{
      const perFolder = await Promise.all(ARTWORK_FOLDERS.map(async folder=>{
        try{
          const res = await fetch(`https://api.github.com/repos/${ARTWORK_REPO}/contents/art/${encodeURIComponent(folder)}?ref=${ARTWORK_BRANCH}`);
          if(!res.ok) return [];
          const items = await res.json();
          if(!Array.isArray(items)) return [];
          return items
            .filter(it=> it.type==='file' && IMAGE_EXT_RE.test(it.name))
            // same-origin relative path: works with no CORS setup once this page lives on artnomad.world
            // alongside the /art folder; a local dev proxy mirrors this path for local preview
            .map(it=> `/art/${encodeURIComponent(folder)}/${encodeURIComponent(it.name)}`);
        }catch(e){ return []; }
      }));
      const pool = perFolder.flat();
      if(pool.length){
        try{ localStorage.setItem(ARTWORK_CACHE_KEY, JSON.stringify({ at: Date.now(), pool })); }catch(e){}
        return pool;
      }
    }catch(e){}
    // fresh fetch failed or came back empty (e.g. GitHub API rate limit) — fall back to
    // whatever we had cached before, even if stale, rather than dropping to placeholder photos
    return (cached && cached.pool) || [];
  }
  // kick the fetch off now so it runs in parallel with scene setup below; awaited later, right before frames are placed
  const artworkPoolPromise = fetchArtworkPool();
  let ARTWORK_POOL = [];
  function pickArtworkUrl(seed, pxW, pxH){
    if(ARTWORK_POOL.length) return ARTWORK_POOL[seed % ARTWORK_POOL.length];
    return `https://picsum.photos/seed/${seed}/${pxW}/${pxH}`; // fallback if the GitHub fetch failed
  }

  // ---------- renderer / scene / camera ----------
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xd7dadc);

  const EYE_HEIGHT = 1.65;
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.05, 220);
  const playerRig = new THREE.Object3D();
  playerRig.position.set(7, EYE_HEIGHT, 14);
  playerRig.rotation.y = Math.PI * 0.82;
  playerRig.add(camera);
  scene.add(playerRig);

  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- geometry constants ----------
  const HALF_W = 17, HALF_D = 19;      // room footprint: x -17..17, z -19..19 (longer front hall)
  const EAVE_H = 8, RIDGE_H = 13;      // wall top / roof peak
  const MEZZ_H = 4.3;                   // mezzanine floor height
  const STAIR_X1=-3, STAIR_X2=3, STAIR_Z_BOTTOM=2.6, STAIR_Z_TOP=-1.8;

  // ---------- lighting: bright, soft, gallery-white ----------
  scene.add(new THREE.HemisphereLight(0xf4f6f8, 0xa8aaa8, 0.75));
  scene.add(new THREE.AmbientLight(0xffffff, 0.16));

  function skylight(x,y,z,intensity,castShadow){
    const l = new THREE.PointLight(0xfff7ec, intensity, 24, 2);
    l.position.set(x,y,z);
    if(castShadow){
      l.castShadow = true;
      l.shadow.mapSize.set(1024,1024);
      l.shadow.camera.near = 0.5;
      l.shadow.camera.far = 26;
      l.shadow.bias = -0.003;
    }
    scene.add(l);
  }
  skylight(-8, 11, -6, 1.2, true);
  skylight(6, 11, -3, 1.15, false);
  skylight(-4, 11, 5, 1.25, true);
  skylight(10, 11, 6, 1.15, false);
  skylight(0, 6.2, -9.5, 0.75, false);

  // ---------- materials ----------
  const wallMat = new THREE.MeshStandardMaterial({ color:0xcdd0d2, roughness:0.96, metalness:0.0 });
  const floorMat = new THREE.MeshStandardMaterial({ color:0xc2c5c7, roughness:0.38, metalness:0.05 });
  const beamMat = new THREE.MeshStandardMaterial({ color:0xf7f7f5, roughness:0.4, metalness:0.15 });
  const glassMat = new THREE.MeshStandardMaterial({
    color:0xf3f8fc, emissive:0xe4f0fa, emissiveIntensity:0.75,
    roughness:0.12, metalness:0.0, transparent:true, opacity:0.95, side:THREE.DoubleSide
  });
  const stairMat = new THREE.MeshStandardMaterial({ color:0xc7cacc, roughness:0.55, metalness:0.08 });

  // ---------- floor ----------
  function floorAOTexture(){
    const c = document.createElement('canvas'); c.width=512; c.height= Math.round(512*(HALF_D/HALF_W));
    const g = c.getContext('2d');
    g.fillStyle = '#c6c9cb'; g.fillRect(0,0,c.width,c.height);
    // soft pools of light under the skylights
    function glow(x,y,r,alpha){
      const grad = g.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0, `rgba(238,240,240,${alpha})`);
      grad.addColorStop(1, 'rgba(238,240,240,0)');
      g.fillStyle = grad; g.fillRect(0,0,c.width,c.height);
    }
    glow(c.width*0.32, c.height*0.35, c.width*0.32, 0.55);
    glow(c.width*0.62, c.height*0.55, c.width*0.28, 0.5);
    glow(c.width*0.4, c.height*0.75, c.width*0.3, 0.4);
    // darker vignette toward the walls for grounding
    const vg = g.createRadialGradient(c.width/2,c.height/2, Math.min(c.width,c.height)*0.25, c.width/2,c.height/2, Math.max(c.width,c.height)*0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(20,22,24,0.22)');
    g.fillStyle = vg; g.fillRect(0,0,c.width,c.height);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  floorMat.map = floorAOTexture();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALF_W*2, HALF_D*2), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // ---------- perimeter walls (also collision) ----------
  const wallBoxes = [
    { x1:-HALF_W-0.3, z1:-HALF_D,     x2:-HALF_W,     z2:HALF_D },
    { x1:-HALF_W,     z1:-HALF_D-0.3, x2:HALF_W,      z2:-HALF_D },
    { x1:-HALF_W,     z1:HALF_D,      x2:HALF_W,      z2:HALF_D+0.3 },
    { x1:HALF_W,      z1:-HALF_D,     x2:HALF_W+0.3,  z2:HALF_D }
  ];
  const baseboardMat = new THREE.MeshStandardMaterial({ color:0xa9adb0, roughness:0.85 });
  wallBoxes.forEach(w=>{
    const sx=w.x2-w.x1, sz=w.z2-w.z1;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, EAVE_H, sz), wallMat);
    mesh.position.set((w.x1+w.x2)/2, EAVE_H/2, (w.z1+w.z2)/2);
    mesh.castShadow=true; mesh.receiveShadow=true;
    scene.add(mesh);
    // baseboard: a slightly darker strip grounding the wall to the floor
    const base = new THREE.Mesh(new THREE.BoxGeometry(sx+0.02, 0.14, sz+0.02), baseboardMat);
    base.position.set((w.x1+w.x2)/2, 0.07, (w.z1+w.z2)/2);
    scene.add(base);
  });

  // gable-end infill triangles (roof pitch above eave height)
  function gableTriangle(zPos){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      -HALF_W,EAVE_H,zPos,  HALF_W,EAVE_H,zPos,  0,RIDGE_H,zPos
    ]),3));
    geo.setIndex([0,1,2]);
    geo.computeVertexNormals();
    const m = wallMat.clone(); m.side = THREE.DoubleSide;
    const mesh = new THREE.Mesh(geo, m);
    mesh.castShadow=true; mesh.receiveShadow=true;
    scene.add(mesh);
  }
  gableTriangle(-HALF_D); gableTriangle(HALF_D);

  // ---------- pitched glass roof ----------
  function quad(p1,p2,p3,p4,mat){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
      ...p1,...p2,...p3,  ...p1,...p3,...p4
    ]),3));
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  }
  scene.add(quad([-HALF_W,EAVE_H,-HALF_D],[0,RIDGE_H,-HALF_D],[0,RIDGE_H,HALF_D],[-HALF_W,EAVE_H,HALF_D], glassMat));
  scene.add(quad([HALF_W,EAVE_H,-HALF_D],[0,RIDGE_H,-HALF_D],[0,RIDGE_H,HALF_D],[HALF_W,EAVE_H,HALF_D], glassMat));

  const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,HALF_D*2), beamMat);
  ridge.position.set(0,RIDGE_H,0); ridge.castShadow=true;
  scene.add(ridge);

  const slopeLen = Math.hypot(HALF_W, RIDGE_H-EAVE_H);
  const angleL = Math.atan2(RIDGE_H-EAVE_H, HALF_W);
  const angleR = -angleL;
  function rafter(xMid,yMid,z,angle){
    const m = new THREE.Mesh(new THREE.BoxGeometry(slopeLen,0.14,0.14), beamMat);
    m.position.set(xMid,yMid,z); m.rotation.z = angle; m.castShadow=true;
    scene.add(m);
  }
  for(let z=-HALF_D+1; z<=HALF_D-1; z+=3.5){
    rafter(-HALF_W/2, (EAVE_H+RIDGE_H)/2, z, angleL);
    rafter(HALF_W/2, (EAVE_H+RIDGE_H)/2, z, angleR);
  }
  function purlin(x,y){
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.14,HALF_D*2), beamMat);
    m.position.set(x,y,0); m.castShadow=true;
    scene.add(m);
  }
  [0.18,0.42,0.66,0.9].forEach(t=>{
    purlin(-HALF_W + HALF_W*t, EAVE_H + (RIDGE_H-EAVE_H)*t);
    purlin(HALF_W - HALF_W*t, EAVE_H + (RIDGE_H-EAVE_H)*t);
  });
  purlin(-HALF_W, EAVE_H); purlin(HALF_W, EAVE_H);

  // ---------- roof support truss — only over the open double-height space, not the mezzanine ----------
  function strut(p1, p2, radius){
    const dir = new THREE.Vector3().subVectors(p2,p1);
    const len = dir.length();
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,len,6), beamMat);
    mesh.position.copy(p1).add(dir.clone().multiplyScalar(0.5));
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
    mesh.castShadow = true;
    scene.add(mesh);
  }
  const trussZ = 10; // centered in the open front hall (mezzanine only occupies z < 1)
  const hub = new THREE.Vector3(0, RIDGE_H-0.4, trussZ);
  const hubNode = new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8), beamMat);
  hubNode.position.copy(hub);
  hubNode.castShadow = true;
  scene.add(hubNode);
  const trussTargets = [
    new THREE.Vector3(-HALF_W, EAVE_H, trussZ-5.5),
    new THREE.Vector3(-HALF_W, EAVE_H, trussZ+5.5),
    new THREE.Vector3(HALF_W,  EAVE_H, trussZ-5.5),
    new THREE.Vector3(HALF_W,  EAVE_H, trussZ+5.5),
    new THREE.Vector3(0, RIDGE_H, trussZ-6.5),
    new THREE.Vector3(0, RIDGE_H, trussZ+6.5),
    new THREE.Vector3(-HALF_W*0.5, (EAVE_H+RIDGE_H)/2, trussZ),
    new THREE.Vector3(HALF_W*0.5,  (EAVE_H+RIDGE_H)/2, trussZ)
  ];
  trussTargets.forEach(t=> strut(hub, t, 0.075));

  // ---------- clerestory windows on side walls (front, double-height zone) ----------
  function windowBand(xWall, normalDir, z1, z2, yBottom, yTop){
    const w = z2-z1, h = yTop-yBottom;
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(w,h), glassMat);
    glass.position.set(xWall+normalDir*0.02, (yBottom+yTop)/2, (z1+z2)/2);
    glass.rotation.y = normalDir>0 ? Math.PI/2 : -Math.PI/2;
    scene.add(glass);
    for(let z=z1; z<=z2+0.01; z+=2){

    const hbar = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,w), beamMat);
    hbar.position.set(xWall+normalDir*0.04, (yBottom+yTop)/2, (z1+z2)/2);
    scene.add(hbar);
  }
  windowBand(-HALF_W, 1, 1.5, HALF_D-0.8, 5.0, 7.4);
  windowBand(HALF_W, -1, 1.5, HALF_D-0.8, 5.0, 7.4);

  // ---------- mezzanine floor (leaves a stair opening, plus a hopscotch window cut into mezzBack) ----------
  const mezzLeft = new THREE.Mesh(new THREE.BoxGeometry(HALF_W-3, 0.3, HALF_D+1), floorMat);
  mezzLeft.position.set(-(HALF_W+3)/2, MEZZ_H-0.15, (1-HALF_D)/2);
  mezzLeft.receiveShadow=true; mezzLeft.castShadow=true;
  scene.add(mezzLeft);

  const mezzRight = new THREE.Mesh(new THREE.BoxGeometry(HALF_W-3, 0.3, HALF_D+1), floorMat);
  mezzRight.position.set((HALF_W+3)/2, MEZZ_H-0.15, (1-HALF_D)/2);
  mezzRight.receiveShadow=true; mezzRight.castShadow=true;
  scene.add(mezzRight);

  // mezzBack spans x:-3..3, z:-19..-1.8 — its own center (0, -10.4) is the true center of
  // the mezzanine floor, clear of the stair opening, so the hopscotch hole goes there
  const MEZZBACK_CX = 0, MEZZBACK_CZ = -(HALF_D+1.8)/2;
  const HOP_CX = MEZZBACK_CX, HOP_CZ = MEZZBACK_CZ, HOP_W = 3.6, HOP_D = 9; // a bit bigger
  const hopX1 = HOP_CX-HOP_W/2, hopX2 = HOP_CX+HOP_W/2;
  const hopZ1 = HOP_CZ-HOP_D/2, hopZ2 = HOP_CZ+HOP_D/2;

  function mezzSlabPiece(x1,x2,z1,z2){
    const w = x2-x1, d = z2-z1;
    if(w<=0 || d<=0) return;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,0.3,d), floorMat);
    mesh.position.set((x1+x2)/2, MEZZ_H-0.15, (z1+z2)/2);
    mesh.receiveShadow=true; mesh.castShadow=true;
    scene.add(mesh);
  }
  mezzSlabPiece(-3, hopX1, -HALF_D, -1.8);
  mezzSlabPiece(hopX2, 3, -HALF_D, -1.8);
  mezzSlabPiece(hopX1, hopX2, -HALF_D, hopZ1);
  mezzSlabPiece(hopX1, hopX2, hopZ2, -1.8);

  // the hopscotch panel — the glass only exists in the shape of the squares and the dome:
  // the canvas starts fully opaque and floor-colored, then each cell is erased to fully
  // transparent (destination-out) before its colored outline and number are redrawn on top,
  // so from either side you see solid floor everywhere except the actual game shape, which
  // is real see-through glass framed by its own colored border.
  function hopscotchTexture(){
    const W=440, H=1100;
    const c = document.createElement('canvas'); c.width=W; c.height=H;
    const g = c.getContext('2d');
    g.fillStyle = '#c2c5c7'; // matches the mezzanine floor color exactly
    g.fillRect(0,0,W,H);

    const rows = [[1],[2,3],[4],[5,6],[7],[8,9]];
    const colors = ['#ff4fa0','#38d6ff','#ffd23f','#4fe08a'];
    const rowH = 138, sqW = 186, gap = 10;
    g.lineWidth = 7; g.lineJoin='round';
    g.textAlign='center'; g.textBaseline='middle';
    let y = H - 70;

    function cutCell(pathFn, num){
      g.save();
      g.globalCompositeOperation = 'destination-out';
      pathFn(); g.fill();
      g.restore();
      const color = colors[num % colors.length];
      g.strokeStyle = color;
      pathFn(); g.stroke();
      g.fillStyle = color;
      g.font = '700 80px "Comic Sans MS", cursive';
    }
    function cutSquare(x, yTop, num){
      cutCell(()=>{ g.beginPath(); g.rect(x, yTop, sqW, rowH-gap); }, num);
      g.save();
      g.translate(x+sqW/2, yTop+(rowH-gap)/2);
      g.rotate((Math.random()-0.5)*0.14);
      g.fillText(String(num), 0, 0);
      g.restore();
    }
    rows.forEach(row=>{
      const yTop = y - rowH;
      if(row.length===1) cutSquare(W/2-sqW/2, yTop, row[0]);
      else { cutSquare(W/2-sqW-4, yTop, row[0]); cutSquare(W/2+4, yTop, row[1]); }
      y -= rowH;
    });

    // the "home" square (10) — a half-circle dome instead of a box
    const domeCy = y;
    const domeR = sqW;
    const domePath = ()=>{
      g.beginPath();
      g.moveTo(W/2-domeR, domeCy);
      g.arc(W/2, domeCy, domeR, Math.PI, 2*Math.PI, false);
      g.closePath();
    };
    cutCell(domePath, 10);
    g.save();
    g.translate(W/2, domeCy - domeR*0.55);
    g.rotate((Math.random()-0.5)*0.14);
    g.fillText('10', 0, 0);
    g.restore();

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  const hopTex = hopscotchTexture();
  const hopMat = new THREE.MeshPhysicalMaterial({
    map:hopTex, transparent:true, opacity:1,
    roughness:0.1, metalness:0, clearcoat:0.5, clearcoatRoughness:0.15,
    side:THREE.DoubleSide
  });
  const hopGeo = new THREE.PlaneGeometry(HOP_W, HOP_D);
  hopGeo.rotateX(-Math.PI/2);
  const hopPanel = new THREE.Mesh(hopGeo, hopMat);
  hopPanel.position.set(HOP_CX, MEZZ_H-0.15, HOP_CZ);
  scene.add(hopPanel);

  // mezzanine guard rail along the open edge (z=1), excluding the stair gap —
  // just the handrail bar now, no picket posts (those read as a "curtain of thin lines"
  // holding the mezzanine up; replaced below by a single Greek column per side instead)
  function straightRail(x1,z1,x2,z2,y){
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(x1,y,z1), new THREE.Vector3(x2,y,z2)]);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,2,0.045,6,false), stairMat));
  }
  straightRail(-HALF_W, 1, -3, 1, MEZZ_H+0.9);
  straightRail(3, 1, HALF_W, 1, MEZZ_H+0.9);

  // a single classical column per side, standing full height from the ground floor up to
  // the mezzanine's underside, doing the actual visual work of "holding it up"
  function greekColumn(x, z, topY){
    const marble = new THREE.MeshStandardMaterial({ color:0xf1ece1, roughness:0.35, metalness:0.05 });
    const plinthH = 0.3, capitalH = 0.37;
    const shaftH = Math.max(0.5, topY - plinthH - capitalH);

    const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.85,plinthH,0.85), marble);
    plinth.position.set(x, plinthH/2, z);
    plinth.castShadow = true; plinth.receiveShadow = true;
    scene.add(plinth);

    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.28,shaftH,24), marble);
    shaft.position.set(x, plinthH+shaftH/2, z);
    shaft.castShadow = true; shaft.receiveShadow = true;
    scene.add(shaft);

    const echinus = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.24,0.25,24), marble);
    echinus.position.set(x, plinthH+shaftH+0.125, z);
    echinus.castShadow = true;
    scene.add(echinus);

    const abacus = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.12,0.62), marble);
    abacus.position.set(x, plinthH+shaftH+0.25+0.06, z);
    abacus.castShadow = true;
    scene.add(abacus);

    wallBoxes.push({ x1:x-0.45, z1:z-0.45, x2:x+0.45, z2:z+0.45 });
  }
  greekColumn(-10, 1, MEZZ_H);
  greekColumn(10, 1, MEZZ_H);

  // ---------- staircase ----------
  const numSteps = 16;
  const stepRise = MEZZ_H/numSteps;
  const stepRun = (STAIR_Z_BOTTOM-STAIR_Z_TOP)/numSteps;
  for(let i=0;i<numSteps;i++){
    const zTop = STAIR_Z_BOTTOM - i*stepRun;
    const zBottom = zTop - stepRun;
    const yTop = stepRise*(i+1);
    const tread = new THREE.Mesh(new THREE.BoxGeometry(6,0.15,stepRun+0.02), stairMat);
    tread.position.set(0, yTop, (zTop+zBottom)/2);
    tread.castShadow=true; tread.receiveShadow=true;
    scene.add(tread);
    const riser = new THREE.Mesh(new THREE.BoxGeometry(6, stepRise, 0.08), stairMat);
    riser.position.set(0, yTop-stepRise/2, zBottom);
    scene.add(riser);
  }
  function stairRail(xSide){
    const pts=[];
    for(let i=0;i<=numSteps;i++){
      const z = STAIR_Z_BOTTOM + (STAIR_Z_TOP-STAIR_Z_BOTTOM)*(i/numSteps);
      const y = MEZZ_H*(i/numSteps) + 0.9;
      pts.push(new THREE.Vector3(xSide,y,z));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,24,0.045,6,false), stairMat));
    pts.forEach((p,i)=>{
      if(i%2===0 && i>0){
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,p.y-0.02,6), stairMat);
        post.position.set(p.x, p.y/2, p.z);
        scene.add(post);
      }
    });
  }
  stairRail(-3.05); stairRail(3.05);

  // ---------- benches ----------
  function bench(x,z,rotY){
    const mat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.5, metalness:0.05 });
    const g = new THREE.Group();
    const top = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.12,0.6), mat);
    top.position.y=0.44; top.castShadow=true; top.receiveShadow=true;
    const base = new THREE.Mesh(new THREE.BoxGeometry(2.0,0.38,0.42), mat);
    base.position.y=0.19; base.castShadow=true; base.receiveShadow=true;
    g.add(top,base); g.position.set(x,0,z); g.rotation.y=rotY||0;
    scene.add(g);
  }
  bench(9, 12, 0.5);
  bench(-9, 6, 0.4);
  bench(0, -6, 0.3);

  // ---------- table + interactive book ----------
  const TABLE_X = 0, TABLE_Z = 6.5;
  const TABLE_TOP_Y = 0.86;
  (function buildTable(){
    const mat = new THREE.MeshStandardMaterial({ color:0xf1f1ef, roughness:0.4, metalness:0.05 });
    const top = new THREE.Mesh(new THREE.BoxGeometry(2.3,0.06,1.3), mat);
    top.position.set(TABLE_X, TABLE_TOP_Y, TABLE_Z);
    top.castShadow=true; top.receiveShadow=true;
    scene.add(top);
    const legGeo = new THREE.CylinderGeometry(0.04,0.045,TABLE_TOP_Y-0.03,10);
    [[-1.02,-0.55],[1.02,-0.55],[-1.02,0.55],[1.02,0.55]].forEach(([dx,dz])=>{
      const leg = new THREE.Mesh(legGeo, mat);
      leg.position.set(TABLE_X+dx, (TABLE_TOP_Y-0.03)/2, TABLE_Z+dz);
      leg.castShadow=true; leg.receiveShadow=true;
      scene.add(leg);
    });
  })();

  // book: two static hardcovers + a stack of interactive white pages that flip on click
  const book = (function buildBook(){
    const PAGE_W = 0.62, PAGE_D = 0.86, PAGE_GAP = 0.0075;
    const PAGE_COUNT = 10;
    const bookGroup = new THREE.Group();
    bookGroup.position.set(TABLE_X, TABLE_TOP_Y+0.031, TABLE_Z);
    bookGroup.rotation.y = Math.PI/2; // spine parallel to the table's long edge, laid out square on it
    scene.add(bookGroup);

    const coverMat = new THREE.MeshStandardMaterial({ color:0x3d1730, roughness:0.55, metalness:0.15 });
    const pageMat = new THREE.MeshStandardMaterial({ color:0xfbfaf6, roughness:0.92, side:THREE.DoubleSide });

    function makeCover(side){
      const geo = new THREE.BoxGeometry(PAGE_W+0.06, 0.018, PAGE_D+0.08);
      geo.translate(side*(PAGE_W+0.06)/2, 0, 0);
      const mesh = new THREE.Mesh(geo, coverMat);
      mesh.castShadow=true; mesh.receiveShadow=true;
      const pivot = new THREE.Group();
      pivot.rotation.z = side>0 ? 0 : Math.PI;
      pivot.add(mesh);
      bookGroup.add(pivot);
      return pivot;
    }
    const backCover = makeCover(1);  backCover.position.y = 0;
    const frontCover = makeCover(-1); frontCover.position.y = 0;

    const pages = [];
    for(let i=0;i<PAGE_COUNT;i++){
      // PlaneGeometry starts vertical (XY) by default — rotate flat (XZ) so it lies on the
      // book like the covers do, *then* shift its pivot edge out to the spine.
      const geo = new THREE.PlaneGeometry(PAGE_W, PAGE_D);
      geo.rotateX(-Math.PI/2);
      geo.translate(PAGE_W/2, 0, 0); // pivot at the spine edge
      const mesh = new THREE.Mesh(geo, pageMat);
      mesh.castShadow=false; mesh.receiveShadow=true;
      const pivot = new THREE.Group();
      pivot.add(mesh);
      pivot.rotation.z = 0; // starts flat on the right (unread)
      pivot.position.y = 0.012 + i*PAGE_GAP;
      bookGroup.add(pivot);
      pages.push({ pivot, mesh, side:'right', animating:false, from:0, to:0, start:0 });
    }
    const rightStack = pages.slice(); // index 0..N-1, top = last
    const leftStack = [];

    function restack(){
      rightStack.forEach((p,i)=>{ p.pivot.position.y = 0.012 + i*PAGE_GAP; });
      leftStack.forEach((p,i)=>{ p.pivot.position.y = 0.012 + i*PAGE_GAP; });
    }
    function flip(page, toRight){
      page.animating = true;
      page.from = page.pivot.rotation.z;
      page.to = toRight ? 0 : Math.PI;
      page.start = performance.now();
    }
    function turnNext(){
      if(rightStack.length===0) return;
      const p = rightStack.pop();
      p.side='left';
      leftStack.push(p);
      restack();
      flip(p, false);
    }
    function turnPrev(){
      if(leftStack.length===0) return;
      const p = leftStack.pop();
      p.side='right';
      rightStack.push(p);
      restack();
      flip(p, true);
    }
    function update(){
      const now = performance.now();
      pages.forEach(p=>{
        if(!p.animating) return;
        const t = Math.min(1, (now-p.start)/650);
        const e = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; // ease-in-out
        p.pivot.rotation.z = p.from + (p.to-p.from)*e;
        if(t>=1) p.animating=false;
      });
    }
    function raycastMeshes(){ return pages.map(p=>p.mesh); }
    function meshToPage(mesh){ return pages.find(p=>p.mesh===mesh); }

    return { group:bookGroup, update, turnNext, turnPrev, raycastMeshes, meshToPage };
  })();

  // table footprint blocks walking through it
  wallBoxes.push({ x1:TABLE_X-1.25, z1:TABLE_Z-0.75, x2:TABLE_X+1.25, z2:TABLE_Z+0.75 });

  // ---------- poetry push-button: on the mezzanine, a meter past the top of the stairs.
  // Pressing it doesn't pop up text beside it — the poem materializes far below, huge,
  // lying flat on the ground floor, meant to be read by leaning over the mezzanine edge
  // and looking down. Each character is still its own real 3D object, individually
  // spawned on a timer — just flat floor geometry instead of a billboarded sprite this time,
  // since billboards would face the camera at the wrong angle for "text on the floor". ----------
  const BTN_X = 0, BTN_Z = STAIR_Z_TOP - 1.0; // centered on the stairs, one meter past the top
  const poetry = (function buildPoetryButton(){
    const HEADING = "BE DRUNK";
    // Original English rendering of Baudelaire's public-domain "Enivrez-vous" (1869) —
    // not the copyrighted 1997 Louis Simpson translation, my own translation from the French.
    const BODY_PARAGRAPHS = [
      "One must be drunk always. That is the whole matter: it is the only question worth asking. So the crushing weight of Time does not bow your shoulders and grind you into the ground, you must stay drunk without rest.",
      "But on what? On wine, on poetry, on being good \u2014 whichever you like. Only be drunk.",
      "And if now and then, on the steps of some grand house, in the green grass of a ditch, in the dull quiet of your own room, you come to and find the drunkenness fading or gone, ask the wind, the wave, a star, a bird, the clock \u2014 ask everything that flees, everything that sighs, everything that turns, everything that sings, everything that speaks \u2014 ask them what hour it is; and the wind, the wave, the star, the bird, the clock will answer: \u2018It is the hour to be drunk! So you will not be Time\u2019s tortured slaves, be drunk \u2014 stay drunk without end! On wine, on poetry, on being good \u2014 whichever you like.\u2019"
    ];
    const ATTRIBUTION = "\u2014 freely rendered from Baudelaire\u2019s \u201cEnivrez-vous\u201d";

    const colMat = new THREE.MeshStandardMaterial({ color:0xd6d6d4, roughness:0.5, metalness:0.15 });
    const domeMat = new THREE.MeshStandardMaterial({ color:0xc4281c, roughness:0.35, metalness:0.1 });

    const column = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.13,0.95,20), colMat);
    column.position.set(BTN_X, MEZZ_H+0.475, BTN_Z);
    column.castShadow = true; column.receiveShadow = true;
    scene.add(column);

    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.04,20), colMat);
    cap.position.set(BTN_X, MEZZ_H+0.97, BTN_Z);
    cap.castShadow = true;
    scene.add(cap);

    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.13,20,12,0,Math.PI*2,0,Math.PI/2), domeMat);
    dome.position.set(BTN_X, MEZZ_H+0.99, BTN_Z);
    dome.castShadow = true;
    scene.add(dome);

    wallBoxes.push({ x1:BTN_X-0.18, z1:BTN_Z-0.18, x2:BTN_X+0.18, z2:BTN_Z+0.18 });

    // the poem floats in the air in the open double-height void, positioned roughly on a
    // line running from the bench near the bottom of the stairs toward the east wall
    const poemGroup = new THREE.Group();
    poemGroup.position.set(3.5, 0, 7);
    scene.add(poemGroup);

    function glyphTexture(ch, weight){
      const c = document.createElement('canvas'); c.width=64; c.height=80;
      const g = c.getContext('2d');
      g.font = (weight||600)+' 54px "Courier New", monospace';
      g.fillStyle = '#161616';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(ch, 32, 44);
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }
    function ruleTexture(){
      const c = document.createElement('canvas'); c.width=4; c.height=4;
      const g = c.getContext('2d');
      g.fillStyle = '#161616'; g.fillRect(0,0,4,4);
      return new THREE.CanvasTexture(c);
    }

    function wrapParagraph(text, maxChars){
      const words = text.split(' ');
      const lines = [];
      let cur = '';
      words.forEach(w=>{
        const test = cur ? cur+' '+w : w;
        if(test.length > maxChars && cur){ lines.push(cur); cur = w; }
        else cur = test;
      });
      if(cur) lines.push(cur);
      return lines;
    }
    // splits the body into N side-by-side columns (roughly equal length, breaking only at
    // word boundaries) — the room has far more usable width than height, so spreading the
    // poem sideways lets it stay large without needing a floor-to-ceiling column of text
    function splitIntoColumns(paragraphs, n){
      const allWords = paragraphs.join(' ').split(' ');
      const totalLen = allWords.reduce((a,w)=>a+w.length+1,0);
      const target = totalLen/n;
      const cols = []; let cur=[]; let curLen=0;
      allWords.forEach(w=>{
        cur.push(w); curLen += w.length+1;
        if(curLen>=target && cols.length<n-1){ cols.push(cur.join(' ')); cur=[]; curLen=0; }
      });
      if(cur.length) cols.push(cur.join(' '));
      return cols;
    }

    const HEAD_CHAR_W = 1.1, HEAD_SIZE = 1.6, HEAD_Y = 6.6;
    const BODY_CHAR_W = 0.22, BODY_LINE_H = 0.34, BODY_WRAP = 24, BODY_SIZE = 0.28;
    const COLS = 4, COL_GAP = 1.1;
    const ATTR_CHAR_W = 0.16, ATTR_SIZE = 0.2, ATTR_Y = 0.5;

    function buildLayout(){
      const queue = [];

      // heading, centered
      const headStartX = -(HEADING.length-1)*HEAD_CHAR_W/2;
      for(let i=0;i<HEADING.length;i++){
        if(HEADING[i]===' ') continue;
        queue.push({ type:'char', ch:HEADING[i], x:headStartX+i*HEAD_CHAR_W, y:HEAD_Y, size:HEAD_SIZE, weight:700, delay:[70,110] });
      }

      // underline
      const underlineY = HEAD_Y - 1.4;
      queue.push({ type:'rule', width:(HEADING.length)*HEAD_CHAR_W*0.92, y:underlineY, delay:[60,60] });

      // body — four columns side by side
      const cols = splitIntoColumns(BODY_PARAGRAPHS, COLS);
      const colWidth = BODY_WRAP*BODY_CHAR_W;
      const totalWidth = COLS*colWidth + (COLS-1)*COL_GAP;
      const columnTopY = underlineY - 0.8;
      cols.forEach((colText, ci)=>{
        const colCenterX = -totalWidth/2 + colWidth/2 + ci*(colWidth+COL_GAP);
        const lines = wrapParagraph(colText, BODY_WRAP);
        lines.forEach((line, li)=>{
          const startX = colCenterX - (line.length-1)*BODY_CHAR_W/2;
          const y = columnTopY - li*BODY_LINE_H;
          for(let i=0;i<line.length;i++){
            if(line[i]===' ') continue;
            queue.push({ type:'char', ch:line[i], x:startX+i*BODY_CHAR_W, y, size:BODY_SIZE, weight:400, delay:[6,14] });
          }
        });
      });

      // attribution, centered below
      const attrStartX = -(ATTRIBUTION.length-1)*ATTR_CHAR_W/2;
      for(let i=0;i<ATTRIBUTION.length;i++){
        if(ATTRIBUTION[i]===' ') continue;
        queue.push({ type:'char', ch:ATTRIBUTION[i], x:attrStartX+i*ATTR_CHAR_W, y:ATTR_Y, size:ATTR_SIZE, weight:400, delay:[6,12] });
      }

      return queue;
    }

    let state = 'idle'; // idle | typing | shown
    let gen = 0;
    let active = []; // {obj, spawnTime}

    function spawnChar(item){
      const mat = new THREE.SpriteMaterial({ map:glyphTexture(item.ch,item.weight), transparent:true, depthWrite:false, opacity:0 });
      const sprite = new THREE.Sprite(mat);
      sprite.position.set(item.x, item.y, 0);
      sprite.scale.set(0.001,0.001,1);
      poemGroup.add(sprite);
      active.push({ obj:sprite, spawnTime:performance.now(), targetScale:item.size, isChar:true });
    }
    function spawnRule(item){
      const mat = new THREE.SpriteMaterial({ map:ruleTexture(), transparent:true, depthWrite:false, opacity:0 });
      const sprite = new THREE.Sprite(mat);
      sprite.position.set(0, item.y, 0);
      sprite.scale.set(0.001, 0.05, 1);
      poemGroup.add(sprite);
      active.push({ obj:sprite, spawnTime:performance.now(), targetWidth:item.width });
    }

    function clear(){
      active.forEach(a=>{
        poemGroup.remove(a.obj);
        if(a.obj.material.map) a.obj.material.map.dispose();

        const testLine = line + words[n] + ' ';
        if(g.measureText(testLine).width > maxWidth && n>0){
          g.fillText(line, x, y);
          line = words[n] + ' ';

      g.fillText(line, x, y);

  }, {passive:true});
  renderer.domElement.addEventListener('touchmove', e=>{
    if(!active || lookTouchId===null) return;
    for(const t of e.changedTouches){
      if(t.identifier===lookTouchId){
        applyLook(t.clientX-lastX, t.clientY-lastY, TOUCH_SENSITIVITY);
        lastX=t.clientX; lastY=t.clientY;
      }
    }
  }, {passive:true});
  function releaseLookTouch(e){
    for(const t of e.changedTouches){ if(t.identifier===lookTouchId){ lookTouchId=null; lastX=null; lastY=null; } }
  }
  window.addEventListener('touchend', releaseLookTouch);
  window.addEventListener('touchcancel', releaseLookTouch);

  if(isTouchDevice) hud.textContent = 'Joystick — move · drag — look';
  function showOverlay(){
    overlay.style.display='flex';
    requestAnimationFrame(()=>{ overlay.style.opacity='1'; });
    crosshair.style.display='none'; hud.style.display='none'; joystickEl.style.display='none'; leaveBtnEl.style.display='none';
    const jb = document.getElementById('jeffBubble'); if(jb) jb.classList.remove('show');
  }
  function hideOverlay(){
    overlay.style.opacity='0';
    setTimeout(()=>{ overlay.style.display='none'; },400);
    crosshair.style.display='block'; hud.style.display='block';
    if(isTouchDevice){ joystickEl.style.display='block'; leaveBtnEl.style.display='block'; }
  }
  function enterGallery(){
    active=true; lastX=null; lastY=null;
    mouseX = window.innerWidth/2; mouseY = window.innerHeight/2;
    hideOverlay();
    if(renderer.domElement.requestPointerLock){
      try{
        const p = renderer.domElement.requestPointerLock();
        if(p && p.catch) p.catch(()=>{});
      }catch(err){}
    }
  }
  function leaveGallery(){
    active=false; lookTouchId=null; lastX=null; lastY=null;
    resetJoystick();
    if(document.pointerLockElement) document.exitPointerLock();
    showOverlay();
  }
  overlay.addEventListener('click', ()=>{ if(assetsReady) enterGallery(); });
  document.addEventListener('pointerlockchange', ()=>{
    locked = (document.pointerLockElement === renderer.domElement);
    if(!locked && active) leaveGallery();
  });

  // ---------- animate ----------
  const bookRaycaster = new THREE.Raycaster();
  const screenCenter = new THREE.Vector2(0,0);
  function raycastBook(){
    if(!active) return null;
    bookRaycaster.setFromCamera(screenCenter, camera);
    const hits = bookRaycaster.intersectObjects(book.raycastMeshes(), false);
    if(hits.length && hits[0].distance < 3.2) return hits[0];
    return null;
  }
  function raycastButton(){
    if(!active) return null;
    bookRaycaster.setFromCamera(screenCenter, camera);
    const hits = bookRaycaster.intersectObjects([poetry.domeMesh, poetry.columnMesh], false);
    if(hits.length && hits[0].distance < 3.0) return hits[0];
    return null;
  }
  function raycastJeff(){
    if(!active || jeff.getState()!=='idle') return null;
    bookRaycaster.setFromCamera(screenCenter, camera);
    const hits = bookRaycaster.intersectObjects([jeff.bodyMesh], false);
    if(hits.length && hits[0].distance < 3.5) return hits[0];
    return null;
  }
  function updateBookHint(){
    const bookHit = raycastBook();
    if(bookHit){
      interactHint.textContent = 'Click to turn the page';
      interactHint.classList.add('show');
      return;
    }
    const btnHit = raycastButton();
    if(btnHit){
      interactHint.textContent = poetry.getState()==='idle' ? 'Press for poetry' : 'Press to clear';
      interactHint.classList.add('show');
      return;
    }
    const jeffHit = raycastJeff();
    if(jeffHit){
      interactHint.textContent = 'Click to wake Jeff';
      interactHint.classList.add('show');
      return;
    }
    interactHint.classList.remove('show');
  }
  renderer.domElement.addEventListener('click', ()=>{
    if(!active) return;
    const bookHit = raycastBook();
    if(bookHit){
      const page = book.meshToPage(bookHit.object);
      if(page){ if(page.side==='right') book.turnNext(); else book.turnPrev(); }
      return;
    }
    const btnHit = raycastButton();
    if(btnHit){ poetry.press(); return; }
    const jeffHit = raycastJeff();
    if(jeffHit){ jeff.wake(); return; }
  });

  const clock = new THREE.Clock();
  const MOVE_SPEED = 4.95; // 1.5x the original walking speed
  let walkCycle = 0;
  let levelHeight = 0; // stateful current floor height (0 = ground, MEZZ_H = mezzanine)

  function animate(){
    requestAnimationFrame(animate);
    const delta = Math.min(0.05, clock.getDelta());

    if(active && !locked){
      let tx=0, ty=0;
      if(mouseX <= EDGE_MARGIN) tx=-1; else if(mouseX >= window.innerWidth-EDGE_MARGIN) tx=1;
      if(mouseY <= EDGE_MARGIN) ty=-1; else if(mouseY >= window.innerHeight-EDGE_MARGIN) ty=1;
      if(tx!==0 || ty!==0){
        yaw -= tx*EDGE_TURN_SPEED*delta;
        pitch -= ty*EDGE_TURN_SPEED*0.6*delta;
        pitch = Math.max(-1.35, Math.min(1.35, pitch));
        playerRig.rotation.y = yaw;
        camera.rotation.x = pitch;
      }
    }

    let fwd=0, strafe=0;
    if(active){
      if(keys['KeyW']||keys['ArrowUp']) fwd-=1;
      if(keys['KeyS']||keys['ArrowDown']) fwd+=1;
      if(keys['KeyD']||keys['ArrowRight']) strafe+=1;
      if(keys['KeyA']||keys['ArrowLeft']) strafe-=1;
      fwd += joyY; strafe += joyX;
    }
    let moving=false;
    if(fwd!==0 || strafe!==0){
      moving=true;
      const len=Math.hypot(fwd,strafe);
      const speedScale=Math.min(1,len); // analog: a light joystick nudge moves slower than a full push
      const nfwd=fwd/len, nstrafe=strafe/len;
      const dx=(Math.sin(yaw)*nfwd + Math.cos(yaw)*nstrafe)*MOVE_SPEED*speedScale*delta;
      const dz=(Math.cos(yaw)*nfwd - Math.sin(yaw)*nstrafe)*MOVE_SPEED*speedScale*delta;
      playerRig.position.x += dx;
      playerRig.position.z += dz;
      const walls = levelHeight>0.3 ? wallBoxes.concat(stairRailBoxes, mezzRailBoxes) : wallBoxes.concat(stairRailBoxes);
      resolveCollision(playerRig.position, walls);
    }

    // stair ramp: height only updates while inside the stair footprint, otherwise persists
    const px=playerRig.position.x, pz=playerRig.position.z;
    if(px>=STAIR_X1 && px<=STAIR_X2 && pz<=STAIR_Z_BOTTOM && pz>=STAIR_Z_TOP){
      const t = (STAIR_Z_BOTTOM-pz)/(STAIR_Z_BOTTOM-STAIR_Z_TOP);
      levelHeight = Math.max(0,Math.min(1,t)) * MEZZ_H;
    }

    walkCycle = moving ? walkCycle+delta*9 : 0;
    playerRig.position.y = levelHeight + EYE_HEIGHT + (moving ? Math.sin(walkCycle)*0.028 : 0);

    book.update();
    poetry.update();
    jeff.update(delta, camera, renderer);
    updateBookHint();

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
